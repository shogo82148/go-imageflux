name: reviewdog
on: [pull_request]
jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@v1.80.6
        with:
          reporter: github-pr-review
          level: warning
